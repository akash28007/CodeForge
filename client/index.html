<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CodeForge — practice problems, submit C++, get judged in a sandboxed environment, climb the leaderboard." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>CodeForge</title>
    <script>
      // Applied before first paint. React sets this too, but only after the bundle
      // has parsed — without this a light-theme user sees a dark flash on every load.
      (function () {
        try {
          var t = localStorage.getItem('codeforge.theme') === 'light' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.style.colorScheme = t;
        } catch (e) {
          /* private mode / storage disabled — the dark default already applies */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
