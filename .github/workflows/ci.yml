name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: codeforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/codeforge?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: ci-test-secret
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: ci-test-refresh-secret
      JWT_REFRESH_EXPIRES_IN: 7d
      PORT: 4000
      NODE_ENV: test
      EXEC_CPU_LIMIT: 1
      EXEC_MEMORY_LIMIT_MB: 256
      EXEC_TIMEOUT_MS: 5000
      EXEC_QUEUE_CONCURRENCY: 4

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Lint
        working-directory: server
        run: npx eslint "{src,test}/**/*.ts"

      - name: Type-check
        working-directory: server
        run: npx tsc --noEmit -p tsconfig.json

      - name: Apply migrations
        working-directory: server
        run: npx prisma migrate deploy

      - name: Unit tests
        working-directory: server
        run: npm test

      # ubuntu-latest runners have Docker Engine available directly on the host,
      # so this is a real build/run — not mocked, not DinD.
      - name: Build sandbox executor image
        run: docker build -t codeforge-executor -f docker/executor/Dockerfile docker/executor

      - name: E2E tests (real Postgres, Redis, and Docker judging)
        working-directory: server
        run: npm run test:e2e

      - name: Build
        working-directory: server
        run: npm run build

  client:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Lint
        working-directory: client
        run: npx eslint . --ext ts,tsx

      - name: Type-check and build
        working-directory: client
        run: npm run build
